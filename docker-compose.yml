# One command: `docker compose up` (or `podman-compose up`). No cloud keys needed:
# the garden world runs its decisions on local models via Ollama.
services:
  server:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      OLLAMA_URL: http://ollama:11434
      UAS_DB: /data/uas.db
      UAS_DECIDER: ${UAS_DECIDER:-localDm}
      # CPU-only: outcomes are appraised in code by default (see README, Local models).
      UAS_SCORER: ${UAS_SCORER:-fake}
      UAS_APPRAISE: ${UAS_APPRAISE:-false}
      UAS_JOB_TIMEOUT_TICKS: ${UAS_JOB_TIMEOUT_TICKS:-600}
      UAS_REFLECTOR: ${UAS_REFLECTOR:-local}
      UAS_PLANNER: ${UAS_PLANNER:-planner}
      UAS_BRAIN: ${UAS_BRAIN:-models}
      OLLAMA_THREADS: ${OLLAMA_THREADS:-4}
      UAS_ADMIN_KEYS: ${UAS_ADMIN_KEYS:-}
      UAS_VISITOR_KEYS: ${UAS_VISITOR_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uas-data:/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  ollama:
    image: docker.io/ollama/ollama:latest
    # Never let model calls take over the machine: a hard cap plus a low CPU weight.
    cpus: ${OLLAMA_CPUS:-4}
    cpu_shares: ${OLLAMA_CPU_SHARES:-256}
    environment:
      OLLAMA_KEEP_ALIVE: "-1"           # keep models loaded (no reload stalls)
      OLLAMA_MAX_LOADED_MODELS: "3"     # decision, text and plan models resident
      OLLAMA_NUM_PARALLEL: "1"          # the server's queue orders requests
      OLLAMA_CONTEXT_LENGTH: "2048"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Pulls the default local models on first start (a no-op once they're in the volume).
  ollama-pull:
    image: docker.io/ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - >-
        ollama pull llama3.2:1b && ollama pull qwen3.5:0.8b && ollama pull laya:421m-typed-decisions-bf16 &&
        printf 'FROM laya:421m-typed-decisions-bf16\nPARAMETER num_thread ${OLLAMA_THREADS:-4}\n' > /tmp/Modelfile.uas-laya &&
        ollama create uas-laya -f /tmp/Modelfile.uas-laya
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  uas-data:
  ollama-models:
