# Podman override for hosts where rootless `podman network create` fails (netavark "EOF", seen on
# WSL). Uses host networking instead of a compose network; Docker users don't need this file.
#   podman-compose -f docker-compose.yml -f compose.podman.yml up
services:
  server:
    network_mode: host
    environment:
      OLLAMA_URL: http://127.0.0.1:${UAS_OLLAMA_PORT:-11435}
      PORT: ${PORT:-8080}
  ollama:
    network_mode: host
    environment:
      OLLAMA_HOST: 127.0.0.1:${UAS_OLLAMA_PORT:-11435}
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "3"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
    cpus: ${OLLAMA_CPUS:-4}
    cpu_shares: ${OLLAMA_CPU_SHARES:-256}
  ollama-pull:
    network_mode: host
    environment:
      OLLAMA_HOST: http://127.0.0.1:${UAS_OLLAMA_PORT:-11435}
